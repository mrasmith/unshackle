services:
  unshackle:
    image: ghcr.io/mrasmith/unshackle:latest
    container_name: unshackle
    restart: unless-stopped

    ports:
      - "8786:8786"

    environment:
      TZ: Europe/Dublin

    volumes:
      - /home/docker/unshackle/config:/config
      - /home/docker/unshackle/downloads:/downloads
      - /home/docker/unshackle/data:/data

    command:
      - unshackle
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8786"
      - --api-only
